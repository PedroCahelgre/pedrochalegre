<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
    }
    .container {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px;
      background:
        radial-gradient(circle at 30% 50%, rgba(59,130,246,0.15), transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(139,92,246,0.1), transparent 40%),
        linear-gradient(180deg, #000 0%, #0a0c14 100%);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      font-size: 13px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      width: fit-content;
      margin-bottom: 30px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 12px rgba(59,130,246,0.9);
    }
    h1 {
      font-size: 72px;
      font-weight: 300;
      line-height: 0.9;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .subtitle {
      font-size: 28px;
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.92);
      line-height: 1.1;
      max-width: 700px;
      margin-bottom: 40px;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .tags {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 8px 18px;
      border: 1px solid rgba(59,130,246,0.4);
      border-radius: 8px;
      background: rgba(59,130,246,0.08);
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.05em;
    }
    .corner {
      position: absolute;
      bottom: 60px;
      right: 80px;
      text-align: right;
    }
    .corner .name {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
    }
    .corner .role {
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(59,130,246,0.7);
      margin-top: 4px;
    }
    .logo {
      position: absolute;
      top: 60px;
      right: 80px;
      width: 60px;
      height: 60px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.jpeg" alt="PC" class="logo" />
    <div class="badge">
      <span class="dot"></span>
      Full Stack Developer
    </div>
    <h1>Pedro Chalegre</h1>
    <p class="subtitle">Transformando ideias em experiências digitais de alta performance.</p>
    <div class="tags">
      <span class="tag">React</span>
      <span class="tag">Next.js</span>
      <span class="tag">TypeScript</span>
      <span class="tag">Node.js</span>
      <span class="tag">Criação de Sites</span>
      <span class="tag">Recife, PE</span>
    </div>
    <div class="corner">
      <div class="name">Pedro Chalegre</div>
      <div class="role">Full Stack Developer — Recife, PE</div>
    </div>
  </div>
</body>
</html>
